{t:2,sentence:'In the old days, there were a small zoo near the market.',parts:['there were','In the old days,','a small zoo','near the market'],correct:0,fix:'In the old days, <hi>there was</hi> a small zoo near the market.',reason:'Use “there was” with one place in the past.'},

{t:2,sentence:'Were there a shopping center downtown many years ago?',parts:['Were there','a shopping center','downtown','many years ago?'],correct:0,fix:'<hi>Was there</hi> a shopping center downtown many years ago?',reason:'Use “was there” with one singular place.'},
{t:2,sentence:'Long ago, there wasn’t any cars in the street.',parts:['Long ago,','any cars','there wasn’t','in the street'],correct:2,fix:'Long ago, <hi>there weren’t</hi> any cars in the street.',reason:'Use “there weren’t” with “any” + plural noun.'},

{t:2,sentence:'There are a factory in the city now.',parts:['There are','a factory','in the city','now'],correct:0,fix:'<hi>There is</hi> a factory in the city now.',reason:'Use “there is” with one place now.'},
{t:2,sentence:'Were there any store near the bus stop in the past?',parts:['Were there','any store','near the bus stop','in the past?'],correct:1,fix:'Were there <hi>any stores</hi> near the bus stop in the past?',reason:'After “any” in this question, use the plural noun.'},
{t:2,sentence:'Now, they made cell phones in the factories.',parts:['Now,','cell phones','they made','in the factories'],correct:2,fix:'Now, <hi>they make</hi> cell phones in the factories.',reason:'Use present “make” with “now”.'},
{t:2,sentence:'In the past, there weren’t a hospital near the market.',parts:['In the past,','a hospital','near the market','there weren’t'],correct:3,fix:'In the past, <hi>there wasn’t</hi> a hospital near the market.',reason:'Use “there wasn’t” with one place.'},
{t:2,sentence:'These days, there is many supermarkets in town.',parts:['These days,','many supermarkets','there is','in town'],correct:2,fix:'These days, <hi>there are</hi> many supermarkets in town.',reason:'Use “there are” with plural places now.'},
{t:2,sentence:'Years ago, it is different from today.',parts:['Years ago,','different','from today','it is'],correct:3,fix:'Years ago, <hi>it was</hi> different from today.',reason:'Use past “was” with past time expressions.'},

{t:2,sentence:'Now, there was a sports center near my house.',parts:['Now,','there was','a sports center','near my house'],correct:1,fix:'Now, <hi>there is</hi> a sports center near my house.',reason:'Use present “there is” with “now”.'},

{t:3,chunks:['In the old days,','there was','a small market','near the bus stop'],answer:'In the old days, there was a small market near the bus stop.'},

function seededShuffle(arr,seed){const a=[...arr];let s=seed;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)&0xffffffff;const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function hiHTML(s){return s.replace(/<hi>(.*?)<\/hi>/g,'<span class="hi">$1</span>')}

function partOf(i){return i<14?0:i<28?1:2}

function applyAdaptiveLayout(){const sentence=document.querySelector('.sentence-line'),err=document.querySelector('.err-sentence'),helper=document.querySelector('.helper-line');if(sentence)fitTextOneLine(sentence,null,18);if(err)fitTextOneLine(err,null,17);if(helper)fitTextOneLine(helper,null,13)}
function renderTabs(i){return `<div class="part-tabs">${PARTS.map((p,pi)=>{const done=answered.slice(p.start,p.start+p.size).filter(x=>x!==undefined).length,active=partOf(i)===pi;return `<button class="ptab${active?' active':''}" onclick="go(${p.start})">${p.icon} ${p.label}<span class="pt-label">${done}/${p.size} done</span></button>`}).join('')}</div>`}
function render(i){cur=i;const q=QS[i],done=answered.filter(x=>x!==undefined).length,correct=answered.filter(x=>x==='ok').length,pct=Math.round(done/QS.length*100);let body='';
if(q.t===1){const dis=answered[i]!==undefined;body=`<div class="sentence-line">${q.before} <span class="blank"></span> ${q.after}</div><div class="hint-tag">💡 ${q.hint}</div><input class="fi" type="text" id="fi${i}" placeholder="Type your answer…" ${dis?'disabled':''} onkeydown="if(event.key==='Enter')chkFill(${i})"/><button class="ckbtn" style="margin-top:10px" onclick="chkFill(${i})" ${dis?'disabled':''}>Check ✓</button>`}
else if(q.t===2){const opts=q.parts.map((p,j)=>{let cls='obtn';if(answered[i]!==undefined){if(j===q.correct)cls='obtn correct';else if(typeof answered[i]==='number'&&answered[i]===j)cls='obtn wrong'}return `<button class="${cls}" id="op${i}_${j}" onclick="pickOpt(${i},${j})" ${answered[i]!==undefined?'disabled':''}>${String.fromCharCode(65+j)}. ${p}</button>`}).join('');body=`<div class="helper-line">Which part has an error?</div><div class="err-sentence">"${q.sentence}"</div><div class="opts">${opts}</div>`}
else{if(!arState[i])arState[i]={chosen:[],available:[...SHUFFLE[i]]};const st=arState[i],chips=SHUFFLE[i].map(ci=>`<span class="wchip${st.available.includes(ci)?'':' used'}" onclick="addC(${i},${ci})">${q.chunks[ci]}</span>`).join(''),achips=st.chosen.map((ci,j)=>`<button class="achip" onclick="remC(${i},${j})">${q.chunks[ci]} <em>✕</em></button>`).join(''),ph=st.chosen.length===0?'<span class="aph">Tap chunks to build the sentence →</span>':'';body=`<div class="helper-line">Put the chunks in the correct order.</div><div class="chips">${chips}</div><div class="abox">${ph}${achips}</div><button class="ckbtn" onclick="chkArr(${i})" ${answered[i]!==undefined?'disabled':''}>Check ✓</button>`}
const allDone=done===QS.length;document.getElementById('app').innerHTML=`<div class="qw">${renderTabs(i)}<div class="prog-row"><span class="prog-label">Question ${i+1} / ${QS.length}</span><span class="prog-score">✅ ${correct} correct</span></div><div class="pbar"><div class="pfill" style="width:${pct}%"></div></div><div class="qcard"><div class="qmeta"><span class="qnum">Q${i+1}</span><span class="badge ${typeColor[q.t]}">${typeIcon[q.t]} ${typeLabel[q.t]}</span></div>${body}<div id="fb${i}"></div></div><div class="navrow"><div class="nav-left"><button class="nbtn" onclick="go(${i-1})" ${i===0?'disabled':''}>← Prev</button><button class="nbtn" onclick="go(${i+1})" ${i===QS.length-1?'disabled':''}>Next →</button></div>${allDone?'<button class="nbtn pri" onclick="showScore()">See Results 🎉</button>':''}</div></div>`;applyAdaptiveLayout();if(answered[i]!==undefined)restoreFB(i)}
window.addEventListener('resize',applyAdaptiveLayout);
function t2fb(q,ok){return `<div class="fb ${ok?'ok':'no'}"><div>${ok?`✓ Correct! <strong>"${q.parts[q.correct]}"</strong> is the error.`:`✗ The error is <strong>"${q.parts[q.correct]}"</strong>.`}</div><div style="margin-top:5px;font-size:14px;opacity:.86">${q.reason}</div><div class="fb-label">Corrected sentence</div><div class="fb-sentence">${hiHTML(q.fix)}</div></div>`}
function restoreFB(i){const q=QS[i],fb=document.getElementById('fb'+i);if(!fb)return;const ok=answered[i]==='ok';if(q.t===1){const fi=document.getElementById('fi'+i);if(fi&&!fi.value)fi.value=q.answer;fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'✓ Correct! Well done!':'✗ Incorrect. Answer: '+q.answer}else if(q.t===2)fb.innerHTML=t2fb(q,ok);else{fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'✓ Correct! Well done!':'✗ Incorrect. '+q.answer}}
function chkFill(i){if(answered[i]!==undefined)return;const fi=document.getElementById('fi'+i),answers=[QS[i].answer,...(QS[i].alts||[])].map(norm),ok=answers.includes(norm(fi.value));if(ok)score++;answered[i]=ok?'ok':'no';fi.disabled=true;const fb=document.getElementById('fb'+i);fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'✓ Correct! Well done!':'✗ Incorrect. Answer: '+QS[i].answer;updateNav()}
function pickOpt(i,j){if(answered[i]!==undefined)return;const q=QS[i],ok=j===q.correct;if(ok)score++;answered[i]=ok?'ok':j;q.parts.forEach((_,k)=>{const b=document.getElementById('op'+i+'_'+k);if(!b)return;b.disabled=true;if(k===q.correct)b.className='obtn correct';else if(k===j&&!ok)b.className='obtn wrong'});document.getElementById('fb'+i).innerHTML=t2fb(q,ok);updateNav()}
function addC(i,ci){if(answered[i]!==undefined)return;const st=arState[i];if(!st.available.includes(ci))return;st.available=st.available.filter(x=>x!==ci);st.chosen.push(ci);render(i)}
function remC(i,j){if(answered[i]!==undefined)return;const st=arState[i],ci=st.chosen[j];st.chosen.splice(j,1);st.available.push(ci);render(i)}
function chkArr(i){if(answered[i]!==undefined)return;const q=QS[i],st=arState[i],built=norm(st.chosen.map(ci=>q.chunks[ci]).join(' ')),ok=built===norm(q.answer);if(ok)score++;answered[i]=ok?'ok':'no';const fb=document.getElementById('fb'+i);fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'✓ Correct! Well done!':'✗ Incorrect. '+q.answer;updateNav()}
function updateNav(){const done=answered.filter(x=>x!==undefined).length,correct=answered.filter(x=>x==='ok').length,ps=document.querySelector('.prog-score'),pf=document.querySelector('.pfill'),tabs=document.querySelector('.part-tabs');if(ps)ps.textContent=`✅ ${correct} correct`;if(pf)pf.style.width=Math.round(done/QS.length*100)+'%';if(tabs)tabs.outerHTML=renderTabs(cur);if(done===QS.length){const nr=document.querySelector('.navrow');if(nr&&!nr.querySelector('.pri')){const b=document.createElement('button');b.className='nbtn pri';b.textContent='See Results 🎉';b.onclick=showScore;nr.appendChild(b)}}}
function go(i){if(i<0||i>=QS.length)return;cur=i;render(i)}
function showScore(){const correct=answered.filter(x=>x==='ok').length,pct=Math.round(correct/QS.length*100),emoji=pct>=90?'🏆':pct>=70?'🌟':pct>=50?'💪':'📖',msg=pct>=90?'Excellent! You’re a grammar star!':pct>=70?'Good job! Keep practising.':pct>=50?'Not bad. Review and try again!':'Keep studying — you can do it!',t1c=answered.filter((x,i)=>QS[i].t===1&&x==='ok').length,t2c=answered.filter((x,i)=>QS[i].t===2&&x==='ok').length,t3c=answered.filter((x,i)=>QS[i].t===3&&x==='ok').length;document.getElementById('app').innerHTML=`<div class="qw"><div class="scard"><div class="trophy">${emoji}</div><div class="sbig">${correct}/${QS.length}</div><div class="smsg">${msg}</div><div class="slbl">${pct}% correct</div><div class="sbreak"><div class="sbi">✏️ Complete: ${t1c}/14</div><div class="sbi">🔍 Find error: ${t2c}/14</div><div class="sbi">🔀 Arrange: ${t3c}/14</div></div><button class="rbtn" onclick="restart()">🔄 Try Again</button></div></div>`}
function restart(){cur=0;score=0;answered=[];arState={};render(0)}
render(0);
</script></body></html>
